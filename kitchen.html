<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Зерно - экран кухни</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --color-paper: #F0E8DC; --color-surface: #FAF6EF; --color-ink: #2B1D16; --color-muted: #6E5E52;
  --color-line: #DCCFBF; --color-accent: #A8581D; --color-ok: #2E5B45; --color-focus: #1D4ED8;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --radius-m: 16px;
}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--color-paper); color: var(--color-ink); font: 400 1rem/1.5 var(--font-body); padding: env(safe-area-inset-top) max(var(--space-md), env(safe-area-inset-right)) env(safe-area-inset-bottom) max(var(--space-md), env(safe-area-inset-left)); }
button, input { font: inherit; }
:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
header { max-width: 1100px; margin: 0 auto; padding: var(--space-lg) 0 var(--space-md); display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); flex-wrap: wrap; }
h1 { margin: 0; font: 600 1.25rem/1.2 var(--font-display); }
.stamp { color: var(--color-muted); font-size: .875rem; }
.btn { min-height: 44px; padding: 0 var(--space-lg); border-radius: 999px; border: 2px solid var(--color-ink); background: transparent; font-weight: 600; white-space: nowrap; cursor: pointer; }
.btn-primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
.btn[disabled] { opacity: .5; }
main { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-lg); padding-bottom: var(--space-lg); }
@media (min-width: 860px) { main { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); } }
h2 { margin: 0 0 var(--space-md); font: 600 1.125rem/1.2 var(--font-display); }
.card { background: var(--color-surface); border-radius: var(--radius-m); padding: var(--space-md); border: 2px solid transparent; margin-bottom: var(--space-md); }
.card.new { border-color: var(--color-accent); }
.card.old { opacity: .6; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-md); }
.num { font: 600 1.5rem/1 var(--font-display); }
.tbl { font-weight: 600; white-space: nowrap; }
ul { margin: var(--space-sm) 0; padding-left: 1.1em; }
.cm { margin: 0 0 var(--space-sm); color: var(--color-muted); }
.row { display: flex; justify-content: space-between; align-items: center; gap: var(--space-md); }
.empty { color: var(--color-muted); }
#gate { max-width: 420px; margin: 20vh auto; display: grid; gap: var(--space-md); }
#gate input { min-height: 48px; padding: 0 var(--space-md); border-radius: 10px; border: 2px solid var(--color-ink); background: var(--color-surface); }
.err { color: #8A2412; margin: 0; }
</style>
</head>
<body>
<form id="gate">
  <h1>Экран кухни</h1>
  <label for="key">Ключ доступа (выдаёт администратор демо)</label>
  <input id="key" type="password" autocomplete="off" required>
  <p class="err" id="gateErr" hidden></p>
  <button class="btn btn-primary" type="submit">Открыть</button>
</form>

<div id="app" hidden>
  <header><h1>Зерно: кухня и зал</h1><span class="stamp" id="stamp">обновляется каждые 5 секунд</span><button class="btn" id="out" type="button">Выйти</button></header>
  <main>
    <section aria-labelledby="oh"><h2 id="oh">Заказы</h2><div id="orders"></div></section>
    <section aria-labelledby="ch"><h2 id="ch">Зовут официанта</h2><div id="calls"></div></section>
  </main>
</div>

<script>
"use strict";
const API = "https://zerno-lepestok-api.tuzir2022.workers.dev";
const log = { warn: (m, c) => console.warn(JSON.stringify({ ts: new Date().toISOString(), level: "warn", scope: "zerno-kitchen", msg: m, ...c })), error: (m, e, c) => console.error(JSON.stringify({ ts: new Date().toISOString(), level: "error", scope: "zerno-kitchen", msg: m, ...c, error: { name: e?.name, message: e?.message, stack: e?.stack } })) };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const NAMES = { espresso: "Эспрессо", americano: "Американо", cappuccino: "Капучино", flatwhite: "Флэт уайт", raf: "Раф с лавандой", filter: "Фильтр-кофе", cocoa: "Какао", seabuckthorn: "Облепиховый чай", matcha: "Матча-латте", lemonade: "Домашний лимонад", cheesecake: "Чизкейк «Нью-Йорк»", croissant: "Миндальный круассан", syrniki: "Сырники", carrot: "Морковный торт", omelet: "Омлет с травами", avotoast: "Тост с авокадо", oatmeal: "Овсянка с ягодами" };
let key = "", timer = null;
try { key = sessionStorage.getItem("zerno.key") || ""; } catch {}

async function call(path, body) {
  const res = await fetch(API + path, { method: body ? "POST" : "GET", headers: { "X-Admin-Key": key, ...(body ? { "Content-Type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || "http " + res.status); e.status = res.status; throw e; }
  return data;
}
const time = (iso) => new Date(iso).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });

function draw(d) {
  $("#orders").innerHTML = d.orders.length ? d.orders.map((o) => `
    <article class="card ${o.status === "new" ? "new" : "old"}">
      <div class="top"><span class="num">№ ${o.number}</span><span class="tbl">Стол ${o.table_no} · ${time(o.created_at)}</span></div>
      <ul>${o.items.map((i) => `<li>${esc(NAMES[i.id] || i.id)} × ${i.qty}</li>`).join("")}</ul>
      ${o.comment ? `<p class="cm">Пожелание: ${esc(o.comment)}</p>` : ""}
      <div class="row"><strong>${o.total.toLocaleString("ru-RU")} ₽</strong>${o.status === "new" ? `<button class="btn btn-primary" data-kind="order" data-id="${o.id}" type="button">Принять</button>` : "<span>принят</span>"}</div>
    </article>`).join("") : '<p class="empty">Заказов пока нет. Оформите заказ на странице меню, и он появится здесь.</p>';
  $("#calls").innerHTML = d.calls.length ? d.calls.map((c) => `
    <article class="card ${c.status === "new" ? "new" : "old"}">
      <div class="row"><span class="tbl">Стол ${c.table_no} · ${time(c.created_at)}</span>${c.status === "new" ? `<button class="btn btn-primary" data-kind="call" data-id="${c.id}" type="button">Иду</button>` : "<span>обслужен</span>"}</div>
    </article>`).join("") : '<p class="empty">Никто не зовёт.</p>';
}

async function refresh() {
  try {
    draw(await call("/admin/coffee"));
    $("#stamp").textContent = "обновлено в " + time(new Date().toISOString());
  } catch (e) {
    if (e.status === 401) { logout(); $("#gateErr").textContent = "Ключ не подошёл. Проверьте его и попробуйте ещё раз."; $("#gateErr").hidden = false; return; }
    log.error("refresh_failed", e, {});
    $("#stamp").textContent = "нет связи, пробуем снова";
  }
  timer = setTimeout(refresh, 5000);
}
function start() { $("#gate").hidden = true; $("#app").hidden = false; clearTimeout(timer); refresh(); }
function logout() { clearTimeout(timer); key = ""; try { sessionStorage.removeItem("zerno.key"); } catch {} $("#app").hidden = true; $("#gate").hidden = false; }

$("#gate").addEventListener("submit", (e) => { e.preventDefault(); key = $("#key").value.trim(); try { sessionStorage.setItem("zerno.key", key); } catch {} $("#gateErr").hidden = true; start(); });
$("#out").addEventListener("click", logout);
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-kind]"); if (!b) return;
  b.disabled = true;
  try { await call("/admin/coffee/done", { kind: b.dataset.kind, id: b.dataset.id }); clearTimeout(timer); refresh(); }
  catch (err) { log.error("mark_failed", err, { kind: b.dataset.kind }); b.disabled = false; }
});
if (key) start();
</script>
</body>
</html>
